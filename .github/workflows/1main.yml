set -euo pipefail

test -f pubspec.yaml
test -f backend/package.json

mkdir -p .github/workflows

cat > .github/workflows/main.yml <<'YAML'
name: HOPE CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hope-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Fast contract and security tests
        run: npm run test:fast

      - name: Contract tests
        run: npm run test:contract

      - name: Backup tests
        run: npm run test:backup

      - name: Full test suite
        run: npm test

  flutter:
    name: Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: [backend, flutter]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Android executable permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hope-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  static-audit:
    name: Static audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Fix script permissions
        run: chmod +x tools/static_audit.sh backend/scripts/*.sh android/gradlew

      - name: Run static audit
        run: ./tools/static_audit.sh
YAML

chmod +x tools/static_audit.sh backend/scripts/*.sh android/gradlew

git diff --check

echo
echo "========================================"
echo "HOPE CI repaired successfully."
echo "Workflow: .github/workflows/main.yml"
echo "Next push will run Backend + Flutter + Android + Static Audit."
echo "========================================"
